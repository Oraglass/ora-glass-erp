<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORA Glass ERP - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo img { display: block; width: min(220px, 70vw); height: auto; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #C41E3A; }
        .btn { width: 100%; background: #C41E3A; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #a01830; }
        .error { background: #ffe6e6; color: #c41e3a; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
        .success { background: #e8f6ee; color: #166534; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
        .hint { margin-top: 20px; font-size: 12px; color: #666; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <a href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Ora Glass"></a>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% set category, message = messages[0] %}
        <div class="{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url or '' }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="hint">Sign in with your email address. First-time users should open the setup link from an administrator.</p>
    </div>
</body>
</html>
