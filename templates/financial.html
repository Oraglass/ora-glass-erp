<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Financial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#C41E3A;color:white;padding:15px 30px;display:flex;justify-content:space-between}
.header h1{font-size:22px}.header a{color:white;text-decoration:none}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.stat{background:#f9f9f9;padding:20px;border-radius:8px;text-align:center}
.stat h3{font-size:28px;color:#C41E3A;margin-bottom:5px}
.stat p{font-size:13px;color:#666}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f5f5;padding:10px;text-align:left;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="header"><h1>ORA GLASS ERP</h1><a href="/">← Dashboard</a></div>
<div class="container"><div class="card">
<h2 style="margin-bottom:20px;color:#333">Financial Overview</h2>
<div class="stats">
<div class="stat"><h3>$0.00</h3><p>Total Outstanding</p></div>
<div class="stat"><h3>$0.00</h3><p>Paid This Month</p></div>
<div class="stat"><h3>0</h3><p>Overdue Invoices</p></div>
<div class="stat"><h3>$0.00</h3><p>Credit Available</p></div>
</div>
<h3 style="margin-bottom:15px;color:#333">Recent Transactions</h3>
<table>
<thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Balance</th></tr></thead>
<tbody><tr><td colspan="4" style="text-align:center;color:#666">No transactions found</td></tr></tbody>
</table>
</div></div>
</body>
</html>
