<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORA Glass ERP - Choose an account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #333; }
        .wrap { max-width: 560px; margin: 36px auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 8px; }
        h3 { font-size: 16px; margin: 8px 0; }
        .note { color: #666; font-size: 13px; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #C41E3A; color: #fff; border: 0; border-radius: 6px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
        .btn.secondary { background: #fff; color: #C41E3A; border: 1px solid #C41E3A; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        form { margin: 0; }
    </style>
</head>
<body>
    {% include 'partials/header.html' %}
    <div class="wrap">
        <h2>Choose how to continue</h2>
        <p class="note">Continue in the ERP as an administrator, or open a customer's portal as one of their users. Their password is not changed and they are not emailed.</p>
        <form method="post" action="{{ url_for('enter_as_admin') }}" style="margin-bottom:22px">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <button class="btn" type="submit" id="continue-admin" autofocus>Continue to ERP as admin</button>
        </form>
        <h3>Enter a customer's account</h3>
        <div class="form-group">
            <label for="customer-pick">Customer</label>
            <select id="customer-pick"><option value="">Choose a customer</option></select>
        </div>
        <div class="form-group">
            <label for="user-pick">Portal user</label>
            <select id="user-pick" disabled><option value="">Choose a user</option></select>
        </div>
        <p class="note" id="no-users" hidden>This customer has no portal users.</p>
        <form method="post" action="{{ url_for('impersonate') }}" id="enter-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="account" id="account">
            <button class="btn secondary" type="submit" id="enter-portal" disabled>Enter this customer's portal</button>
        </form>
    </div>
<script>
function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
let rows = [];
const customerPick = document.getElementById('customer-pick');
const userPick = document.getElementById('user-pick');
const noUsers = document.getElementById('no-users');
const enterButton = document.getElementById('enter-portal');
const account = document.getElementById('account');
function fillUsers() {
  const row = rows.find(item => item.id === customerPick.value);
  const users = row ? row.users : [];
  userPick.innerHTML = '<option value="">Choose a user</option>' + users.map(user =>
    '<option value="' + esc(user.account) + '">' + esc(user.name) + ' · ' + esc(user.role_label || '') + '</option>'
  ).join('');
  userPick.disabled = !users.length;
  noUsers.hidden = !row || users.length > 0;
  enterButton.disabled = true;
  account.value = '';
}
customerPick.addEventListener('change', fillUsers);
userPick.addEventListener('change', () => {
  account.value = userPick.value;
  enterButton.disabled = !userPick.value;
});
document.getElementById('enter-form').addEventListener('submit', (event) => {
  if (!account.value) event.preventDefault();
});
fetch('/api/impersonation/customers').then(res => res.json()).then(data => {
  rows = data || [];
  customerPick.innerHTML = '<option value="">Choose a customer</option>' + rows.map(row =>
    '<option value="' + esc(row.id) + '">' + esc(row.name) + '</option>'
  ).join('');
});
</script>
</body>
</html>
