<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Customers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#C41E3A;color:white;padding:15px 30px;display:flex;justify-content:space-between}
.header h1{font-size:22px}.header a{color:white;text-decoration:none}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px}
.btn{background:#C41E3A;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer}
.btn-secondary{background:#333}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:20px}
th{background:#f5f5f5;padding:10px;text-align:left;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
.status{padding:4px 8px;border-radius:4px;font-size:11px}
.status.active{background:#d4edda;color:#155724}
.status.inactive{background:#f8d7da;color:#721c24}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-content{background:white;padding:30px;border-radius:8px;width:500px;max-width:90%;max-height:90vh;overflow-y:auto}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.form-row{display:flex;gap:15px}
.form-row .form-group{flex:1}
</style>
</head>
<body>
<div class="header"><h1>ORA GLASS ERP</h1><a href="/">← Dashboard</a></div>
<div class="container"><div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="color:#333">Customers</h2>
<button class="btn" onclick="openModal()">+ Add Customer</button>
</div>
<table>
<thead><tr><th>Company</th><th>City</th><th>Phone</th><th>Tier</th><th>Credit</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="customer-list"><tr><td colspan="7" style="text-align:center;color:#666">Loading...</td></tr></tbody>
</table>
</div></div>
<div class="modal" id="customer-modal">
<div class="modal-content">
<h3 style="margin-bottom:20px">Add Customer</h3>
<div class="form-group"><label>Company Name</label><input type="text" id="c-name"></div>
<div class="form-group"><label>Address</label><input type="text" id="c-address"></div>
<div class="form-row">
<div class="form-group"><label>City</label><input type="text" id="c-city"></div>
<div class="form-group"><label>State</label><input type="text" id="c-state"></div>
<div class="form-group"><label>ZIP</label><input type="text" id="c-zip"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Phone</label><input type="text" id="c-phone"></div>
<div class="form-group"><label>Email</label><input type="email" id="c-email"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Payment Terms</label><select id="c-terms"><option>Net 30</option><option>Net 15</option><option>COD</option><option>Prepaid</option></select></div>
<div class="form-group"><label>Price Tier</label><select id="c-tier"><option value="T1">Tier 1</option><option value="T2" selected>Tier 2</option><option value="T3">Tier 3</option><option value="T4">Tier 4</option></select></div>
</div>
<div class="form-group"><label><input type="checkbox" id="c-credit"> Credit Approved</label></div>
<div style="display:flex;gap:10px;margin-top:20px">
<button class="btn" onclick="saveCustomer()">Save</button>
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
</div>
</div>
</div>
<script>
async function loadCustomers(){const res=await fetch('/api/customers');const data=await res.json();const tbody=document.getElementById('customer-list');tbody.innerHTML='';data.forEach(c=>{tbody.innerHTML+='<tr><td>'+c.name+'</td><td>'+c.city+'</td><td>'+c.phone+'</td><td>'+c.tier+'</td><td>'+(c.credit_approved?'Yes':'No')+'</td><td><span class="status '+c.status+'">'+c.status+'</span></td><td><button onclick="deleteCustomer(\''+c.id+'\')" style="background:none;border:none;color:#C41E3A;cursor:pointer">Delete</button></td></tr>'});if(!data.length)tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#666">No customers</td></tr>'}
function openModal(){document.getElementById('customer-modal').classList.add('active')}
function closeModal(){document.getElementById('customer-modal').classList.remove('active')}
async function saveCustomer(){const data={name:document.getElementById('c-name').value,address:document.getElementById('c-address').value,city:document.getElementById('c-city').value,state:document.getElementById('c-state').value,zip:document.getElementById('c-zip').value,phone:document.getElementById('c-phone').value,email:document.getElementById('c-email').value,payment_terms:document.getElementById('c-terms').value,tier:document.getElementById('c-tier').value,credit_approved:document.getElementById('c-credit').checked};await fetch('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeModal();loadCustomers()}
async function deleteCustomer(id){if(confirm('Delete customer?')){await fetch('/api/customers/'+id,{method:'DELETE'});loadCustomers()}}
loadCustomers();
</script>
</body>
</html>
