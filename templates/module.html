<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ module }} - ORA Glass ERP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
        .header { background: #C41E3A; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; }
        .card h2 { color: #333; margin-bottom: 15px; }
        .card p { color: #666; }
    </style>
</head>
<body>
    {% set show_back = true %}
    {% include 'partials/header.html' %}
    <div class="container">
        <div class="card">
            <h2>{{ module }}</h2>
            {% if note %}<p>{{ note }}</p>{% endif %}
            <p>This module is under development.</p>
        </div>
    </div>
</body>
</html>
