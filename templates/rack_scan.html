<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORA Glass ERP - Pick up racks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5;font-size:18px}
.container{max-width:560px;margin:12px auto;padding:0 16px 40px}
h2{color:#333;font-size:28px;margin:8px 0}
.note{color:#555;font-size:16px;line-height:1.4;margin:8px 0}
.card{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
label{display:block;font-size:16px;color:#333;margin-top:12px}
input,select{display:block;width:100%;margin-top:6px;font-size:22px;padding:14px;border:1px solid #ccc;border-radius:12px}
.keep{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:16px;color:#333}
.keep input{display:inline-block;width:22px;height:22px;margin:0;padding:0}
#scan-input{font-size:32px;padding:18px}
.btn{display:block;width:100%;background:#C41E3A;color:#fff;border:0;border-radius:12px;font-size:22px;font-weight:700;padding:18px 16px;margin-top:12px;cursor:pointer}
.btn.secondary{background:#fff;color:#333;border:1px solid #ccc}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee;font-size:20px}
.ok{color:#166534}
.warn{color:#9f1239}
#reader{margin-top:12px}
</style>
</head>
<body>
{% set show_back = true %}
{% include 'partials/header.html' %}
<div class="container">
<h2>Pick up racks</h2>
<p class="note">Point the phone camera at the QR code. The rack is added as soon as the code is read. Type it if the camera is not available.</p>
<div class="card">
{% if not driver %}
<label>Customer
<select id="customer" aria-label="Customer"></select>
</label>
{% endif %}
<label>Truck plate
<input id="plate" aria-label="Truck plate" placeholder="Optional" autocomplete="off">
</label>
<button type="button" class="btn" id="camera">Start camera</button>
<label class="keep"><input type="checkbox" id="keep-scanning"> Keep scanning</label>
<div id="reader" hidden></div>
<label>Rack number
<input id="scan-input" autofocus autocomplete="off" inputmode="numeric" aria-label="Rack number" enterkeyhint="done">
</label>
<button type="button" class="btn secondary" id="add-rack">Add</button>
</div>
<div class="card" id="list"><p class="note">No racks scanned yet.</p></div>
<button type="button" class="btn" id="confirm">Confirm pickup</button>
<p class="note" id="message"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
function esc(value) {
  return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const DRIVER = {{ driver|tojson }};
const scans = [];
const input = document.getElementById('scan-input');
const list = document.getElementById('list');
let camera = null;
let audioCtx = null;
let scanLock = false;
let lastCameraCode = '';
let lastCameraAt = 0;
let resumeTimer = null;

function unlockBeep() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!audioCtx) audioCtx = new Ctx();
  const pending = audioCtx.resume();
  if (pending && pending.catch) pending.catch(function() {});
  try {
    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start(0);
  } catch (error) {}
}
function beep(ok) {
  try {
    if (!audioCtx) unlockBeep();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const tone = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    tone.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + (ok ? 0.14 : 0.28));
    tone.frequency.value = ok ? 880 : 220;
    tone.start(now);
    tone.stop(now + (ok ? 0.15 : 0.3));
  } catch (error) {}
}
function buzz() {
  try {
    if (navigator.vibrate) navigator.vibrate(150);
  } catch (error) {}
}
function render() {
  if (!scans.length) { list.innerHTML = '<p class="note">No racks scanned yet.</p>'; return; }
  const ready = scans.filter(row => row.result === 'ok');
  const flagged = scans.filter(row => row.result !== 'ok');
  const groups = [];
  ready.forEach(row => {
    const name = row.customer_name || 'Unknown customer';
    let group = groups.find(item => item.name === name);
    if (!group) {
      group = {name: name, rows: []};
      groups.push(group);
    }
    group.rows.push(row);
  });
  let html = groups.map(group => {
    const heading = groups.length > 1 ? '<h3>' + esc(group.name) + '</h3>' : '';
    const rows = group.rows.map(row => '<div class="row ok"><strong>' + esc(row.rack) + '</strong><span>' + esc(row.customer_name || group.name) + '</span></div>').join('');
    return heading + rows;
  }).join('');
  html += flagged.map(row => {
    const detail = row.result === 'unknown' && row.raw ? row.message + ' Scanned text: ' + row.raw : row.message;
    return '<div class="row warn"><strong>' + esc(row.rack || row.raw) + '</strong><span>' + esc(detail) + '</span></div>';
  }).join('');
  list.innerHTML = html;
}
function chosenCustomer() {
  const select = document.getElementById('customer');
  return select ? select.value : '';
}
async function addScan(raw, options) {
  const text = String(raw || '');
  if (!text.trim()) return;
  const res = await fetch('/api/racks/check', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      text: text,
      customer_id: DRIVER ? '' : chosenCustomer(),
      already: scans.filter(row => row.result === 'ok').map(row => row.rack),
      scan_method: (options && options.method) || 'typed'
    })
  });
  const body = await res.json().catch(() => ({result: 'unknown', message: 'Could not check that rack', raw: text, rack: text.trim()}));
  body.scan_method = (options && options.method) || 'typed';
  scans.push(body);
  beep(body.result === 'ok');
  render();
  if (options && options.keepValue) input.value = text.trim();
  else input.value = '';
  input.focus();
}
function qrbox(viewWidth, viewHeight) {
  const edge = Math.max(50, Math.floor(Math.min(viewWidth, viewHeight) * 0.7));
  return {width: edge, height: edge};
}
async function stopCamera() {
  if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
  const box = document.getElementById('reader');
  const current = camera;
  camera = null;
  if (current) {
    try { await current.stop(); } catch (error) {}
    try { current.clear(); } catch (error) {}
  }
  box.hidden = true;
  document.getElementById('camera').textContent = 'Start camera';
  input.focus();
}
async function onCameraCode(text) {
  const code = String(text || '').trim();
  if (!code || scanLock) return;
  const now = Date.now();
  if (code === lastCameraCode && now - lastCameraAt < 2000) return;
  scanLock = true;
  lastCameraCode = code;
  lastCameraAt = now;
  input.value = code;
  buzz();
  const keep = document.getElementById('keep-scanning').checked;
  if (keep && camera) {
    try { await camera.pause(true); } catch (error) {}
  } else {
    await stopCamera();
  }
  await addScan(code, {keepValue: true, method: 'camera'});
  if (keep && camera) {
    resumeTimer = setTimeout(function() {
      scanLock = false;
      if (!camera) return;
      const resumed = camera.resume();
      if (resumed && resumed.catch) resumed.catch(function() {});
    }, 1000);
  } else {
    scanLock = false;
  }
}
async function startCamera() {
  const box = document.getElementById('reader');
  if (!window.Html5Qrcode) {
    document.getElementById('message').textContent = 'The camera scanner did not load.';
    return;
  }
  box.hidden = false;
  const formats = window.Html5QrcodeSupportedFormats;
  const options = {experimentalFeatures: {useBarCodeDetectorIfSupported: false}, verbose: false};
  if (formats && formats.QR_CODE != null) options.formatsToSupport = [formats.QR_CODE];
  camera = new Html5Qrcode('reader', options);
  await camera.start(
    {facingMode: 'environment'},
    {fps: 10, qrbox: qrbox, experimentalFeatures: {useBarCodeDetectorIfSupported: false}},
    onCameraCode,
    function() {}
  );
  document.getElementById('camera').textContent = 'Stop camera';
}
let typedAt = 0;
input.addEventListener('keydown', event => {
  if (!input.value) typedAt = Date.now();
  if (!typedAt) typedAt = Date.now();
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const method = (Date.now() - typedAt) <= 120 ? 'gun' : 'typed';
  typedAt = 0;
  unlockBeep();
  addScan(input.value, {method: method});
});
document.getElementById('add-rack').addEventListener('click', () => {
  typedAt = 0;
  unlockBeep();
  addScan(input.value, {method: 'typed'});
});
document.getElementById('camera').addEventListener('click', async () => {
  unlockBeep();
  if (camera) {
    scanLock = false;
    await stopCamera();
    return;
  }
  try {
    await startCamera();
  } catch (error) {
    document.getElementById('message').textContent = 'The camera could not start. Type the rack number instead.';
    await stopCamera();
  }
});
document.getElementById('confirm').addEventListener('click', async () => {
  const racks = scans.filter(row => row.result === 'ok').map(row => row.rack);
  const res = await fetch('/api/racks/pickup', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      customer_id: DRIVER ? '' : chosenCustomer(),
      truck_plate: document.getElementById('plate').value,
      racks: racks,
      methods: scans.filter(row => row.result === 'ok').reduce((map, row) => {
        map[row.rack] = row.scan_method || 'typed';
        return map;
      }, {})
    })
  });
  const body = await res.json().catch(() => ({}));
  const message = document.getElementById('message');
  if (!res.ok) { message.textContent = body.error || 'The pickup was not saved'; return; }
  message.textContent = 'Picked up ' + (body.moved || []).join(', ');
  scans.length = 0;
  render();
  input.focus();
});
{% if not driver %}
fetch('/api/racks/sites').then(res => res.json()).then(rows => {
  const select = document.getElementById('customer');
  if (!select) return;
  select.innerHTML = '<option value="">Choose a customer</option>' + rows.map(row => '<option value="' + esc(row.id) + '">' + esc(row.name) + '</option>').join('');
});
{% endif %}
window.addEventListener('load', () => input.focus());
</script>
</body>
</html>
