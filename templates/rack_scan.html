<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORA Glass ERP - Scan rack</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5;font-size:18px}
.container{max-width:560px;margin:12px auto;padding:0 16px 32px}
h2{color:#333;font-size:28px;margin:8px 0}
.note{color:#555;font-size:16px;line-height:1.4;margin:8px 0}
.card{background:#fff;border-radius:12px;padding:16px;margin-top:12px}
.btn{display:block;width:100%;background:#C41E3A;color:#fff;border:0;border-radius:12px;font-size:22px;font-weight:700;padding:22px 16px;cursor:pointer;text-align:center}
.btn.secondary{background:#fff;color:#333;border:1px solid #ccc;font-size:20px;padding:18px 16px;margin-top:12px}
label.manual{display:block;font-size:16px;color:#333;margin-top:16px}
label.manual input{display:block;width:100%;margin-top:6px;font-size:28px;padding:16px;border:1px solid #ccc;border-radius:12px}
.wedge{margin-top:18px;color:#777;font-size:14px}
.wedge input{display:block;width:100%;margin-top:4px;font-size:16px;padding:10px;border:1px solid #ddd;border-radius:8px}
video{width:100%;border-radius:12px;background:#111;margin-top:12px;max-height:46vh;object-fit:cover}
#result{margin-top:12px}
.rack-no{font-size:40px;font-weight:700;color:#333;letter-spacing:1px}
.unknown{color:#9f1239}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #eee;vertical-align:top}
.num{text-align:right}
a{color:#C41E3A}
</style>
</head>
<body>
{% set show_back = true %}
{% include 'partials/header.html' %}
<div class="container">
<h2>Scan rack</h2>
<p class="note">Point the phone camera at the QR code already on the rack. The code is the rack number.</p>
<button type="button" class="btn" id="scan-rack">Scan rack</button>
<video id="preview" hidden playsinline muted></video>
<p class="note" id="camera-note" hidden></p>
<div class="card">
<label class="manual">Rack number
<input id="manual-rack" inputmode="numeric" autocomplete="off" enterkeyhint="go" aria-label="Rack number">
</label>
<button type="button" class="btn secondary" id="lookup-rack">Look up</button>
<label class="wedge">Keyboard scanner
<input id="wedge-rack" autocomplete="off" aria-label="Keyboard scanner">
</label>
</div>
<div id="result"></div>
</div>
<script src="{{ url_for('static', filename='jsQR.js') }}"></script>
<script>
function esc(value) {
  return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const resultBox = document.getElementById('result');
let stream = null;
let timer = null;
let lastRaw = '';
let lastAt = 0;

function showResult(body) {
  if (!body.rack) {
    resultBox.innerHTML = '<div class="card"><p class="unknown">That scan did not include a rack number.</p></div>';
    return;
  }
  if (!body.found) {
    resultBox.innerHTML = '<div class="card"><p class="unknown">Unknown rack</p><p class="rack-no">' + esc(body.rack) + '</p><p class="note">Scanned text: ' + esc(body.raw) + '</p></div>';
    return;
  }
  const blocks = (body.matches || []).map(match => {
    const lines = (match.lines || []).map(line => '<tr><td>' + esc(line.serial) + '</td><td>' + esc(line.floor) + '</td><td>' + esc(line.product) + '</td><td>' + esc(line.size) + '</td><td class="num">' + esc(line.qty) + '</td></tr>').join('');
    return '<div class="card"><p class="rack-no">' + esc(match.rack) + '</p><p class="note"><a href="/orders/' + encodeURIComponent(match.order_id) + '">Order ' + esc(match.order_id) + '</a> · ' + esc(match.company) + ' · ' + esc(match.project) + (match.number ? ' · ' + esc(match.number) : '') + '</p><table><thead><tr><th>Serial</th><th>Floor</th><th>Product</th><th>Size</th><th class="num">Pcs</th></tr></thead><tbody>' + (lines || '<tr><td colspan="5">No pieces on this list</td></tr>') + '</tbody></table></div>';
  }).join('');
  resultBox.innerHTML = blocks;
}

async function lookup(raw) {
  const res = await fetch('/api/racks/lookup', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: raw})
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { resultBox.innerHTML = '<div class="card"><p class="unknown">' + esc(body.error || 'Could not look up that rack') + '</p></div>'; return; }
  showResult(body);
}

function acceptScan(raw) {
  const now = Date.now();
  if (!String(raw || '').trim()) return;
  if (raw === lastRaw && now - lastAt < 1500) return;
  lastRaw = raw;
  lastAt = now;
  lookup(raw);
}

async function readFrame(video, canvas, ctx, detector) {
  if (video.readyState < 2) return '';
  if (detector) {
    try {
      const codes = await detector.detect(video);
      if (codes && codes.length) return codes[0].rawValue || '';
    } catch (error) { return ''; }
    return '';
  }
  if (!window.jsQR || !video.videoWidth) return '';
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = window.jsQR(image.data, image.width, image.height, {inversionAttempts: 'dontInvert'});
  return code && code.data ? code.data : '';
}

const scanButton = document.getElementById('scan-rack');
const video = document.getElementById('preview');
const cameraNote = document.getElementById('camera-note');
scanButton.addEventListener('click', async () => {
  if (stream) {
    clearInterval(timer);
    timer = null;
    stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.hidden = true;
    scanButton.textContent = 'Scan rack';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraNote.hidden = false;
    cameraNote.textContent = 'This phone has no camera access. Type the rack number below.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}}});
  } catch (error) {
    cameraNote.hidden = false;
    cameraNote.textContent = 'The camera did not start. Type the rack number below.';
    return;
  }
  video.hidden = false;
  video.srcObject = stream;
  await video.play();
  scanButton.textContent = 'Stop camera';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently: true});
  const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({formats: ['qr_code']}) : null;
  timer = setInterval(async () => {
    const raw = await readFrame(video, canvas, ctx, detector);
    if (raw) acceptScan(raw);
  }, 300);
});

document.getElementById('lookup-rack').addEventListener('click', () => lookup(document.getElementById('manual-rack').value));
document.getElementById('manual-rack').addEventListener('keydown', event => {
  if (event.key === 'Enter') lookup(event.target.value);
});
document.getElementById('wedge-rack').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    lookup(event.target.value);
    event.target.value = '';
  }
});
</script>
</body>
</html>
