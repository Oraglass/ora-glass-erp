<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Shipments</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.container{max-width:1100px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px;margin-bottom:16px}
.note{font-size:13px;color:#555;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{background:#f5f5f5;text-align:left;padding:8px;border-bottom:2px solid #ddd}
td{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
a{color:#C41E3A}
</style>
</head>
<body>
{% set show_back = true %}
{% include 'partials/header.html' %}
<div class="container">
<h2 style="color:#333;margin-bottom:8px">Open shipments / backorders</h2>
<p class="note" style="margin-bottom:12px">Orders that still have pieces to ship or invoice. A quantity already invoiced is not billed again.</p>
<div id="backorders"><p class="note">Loading...</p></div>
</div>
<script>
function esc(value) {
  return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function render(rows) {
  const box = document.getElementById('backorders');
  if (!rows.length) { box.innerHTML = '<div class="card"><p class="note">Nothing is waiting to ship.</p></div>'; return; }
  box.innerHTML = rows.map(order => {
    const lines = (order.lines || []).map(line => '<tr><td>' + esc(line.name) + '</td><td>' + esc(line.remaining) + '</td><td>' + esc(line.sqf_remaining) + '</td><td>' + Number(line.value_remaining || 0).toFixed(2) + '</td></tr>').join('');
    return '<div class="card"><h3 style="color:#333"><a href="/orders/' + esc(order.id) + '">Order ' + esc(order.id) + '</a> · ' + esc(order.company) + '</h3>'
      + '<p class="note">' + esc(order.project || '') + ' · ' + esc(order.shipping_label) + ' · ' + esc(order.remaining_pcs) + ' pcs · ' + esc(order.remaining_sqf) + ' sqf · ' + esc(String(order.currency || '').toUpperCase()) + ' ' + Number(order.remaining_value || 0).toFixed(2) + ' still to ship</p>'
      + '<table><thead><tr><th>Line</th><th>Qty remaining</th><th>Sq ft remaining</th><th>Value remaining</th></tr></thead><tbody>' + lines + '</tbody></table></div>';
  }).join('');
}
fetch('/api/shipments/open').then(res => res.json()).then(render).catch(() => {
  document.getElementById('backorders').innerHTML = '<p class="note">Could not load shipments.</p>';
});
</script>
</body>
</html>
