<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Shipments</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:16px 20px;margin-bottom:12px}
.note{font-size:13px;color:#555;line-height:1.5}
.actions{display:flex;gap:8px;margin:12px 0}
.btn{background:#C41E3A;color:white;border:none;padding:8px 12px;border-radius:4px;text-decoration:none;font-size:13px}
.btn.secondary{background:#fff;color:#333;border:1px solid #ccc}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{background:#f5f5f5;text-align:left;padding:6px;border-bottom:2px solid #ddd;white-space:nowrap}
td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
summary{cursor:pointer;font-weight:600;color:#333}
summary a{color:#C41E3A}
</style>
</head>
<body>
{% set show_back = true %}
{% include 'partials/header.html' %}
<div class="container">
<h2 style="color:#333;margin-bottom:8px">Open shipments / backorders</h2>
<p class="note">Back-ordered items, one row each, grouped by order. The columns match the production Excel. BO quantity is the number of pieces not yet shipped.</p>
<div class="actions">
<a class="btn" href="/api/shipments/open.xlsx">Export Excel</a>
<a class="btn secondary" href="/api/shipments/open.pdf">Export PDF</a>
</div>
<div id="backorders"><p class="note">Loading...</p></div>
</div>
<script>
function esc(value) {
  return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function render(rows) {
  const box = document.getElementById('backorders');
  if (!rows.length) { box.innerHTML = '<div class="card"><p class="note">Nothing is waiting to ship.</p></div>'; return; }
  box.innerHTML = rows.map(order => {
    const lines = (order.lines || []).filter(line => line.bo_qty || line.remaining).map(line => '<tr>'
      + '<td>' + esc(line.serial) + '</td>'
      + '<td>' + esc(line.floor_code || '') + '</td>'
      + '<td>' + esc(line.product_id || '') + '</td>'
      + '<td>' + esc(line.name) + '</td>'
      + '<td class="num">' + Number(line.unit_price || 0).toFixed(2) + '</td>'
      + '<td class="num">' + esc(line.width_mm) + '</td>'
      + '<td class="num">' + esc(line.height_mm) + '</td>'
      + '<td class="num">' + esc(line.width_in) + '</td>'
      + '<td class="num">' + esc(line.height_in) + '</td>'
      + '<td class="num">' + esc(line.bo_qty != null ? line.bo_qty : line.remaining) + '</td>'
      + '<td>' + esc(line.remarks || '') + '</td></tr>').join('');
    return '<details class="card" open><summary><a href="/orders/' + esc(order.id) + '">Order ' + esc(order.id) + '</a> · ' + esc(order.company) + ' · ' + esc(order.project || '') + '</summary>'
      + '<table><thead><tr><th>Serial Number</th><th>Floor Code</th><th>Product ID</th><th>Product Name</th><th class="num">Unit Price</th><th class="num">Width(mm)</th><th class="num">Height(mm)</th><th class="num">Width(In)</th><th class="num">Height(In)</th><th class="num">BO quantity</th><th>Remarks</th></tr></thead><tbody>'
      + lines + '</tbody></table></details>';
  }).join('');
}
fetch('/api/shipments/open').then(res => res.json()).then(render).catch(() => {
  document.getElementById('backorders').innerHTML = '<p class="note">Could not load shipments.</p>';
});
</script>
</body>
</html>
