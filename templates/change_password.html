<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORA Glass ERP - Change password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
        .header { background: #C41E3A; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; letter-spacing: 2px; }
        .header a { color: white; }
        .container { max-width: 480px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 28px; border-radius: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { background: #C41E3A; color: white; border: none; padding: 12px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .hint { font-size: 13px; color: #555; margin-bottom: 16px; line-height: 1.5; }
    </style>
</head>
<body>
    {% include 'partials/header.html' %}
    <div class="container">
        <div class="card">
            <h2 style="margin-bottom:12px;color:#333">Change password</h2>
            {% if must_change %}
            <p class="hint">This password is temporary. Choose a new one before using the rest of the app. Use at least 10 characters with a letter and a number.</p>
            {% else %}
            <p class="hint">Use at least 10 characters with a letter and a number.</p>
            {% endif %}
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Current password</label>
                    <input type="password" name="current_password" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label>New password</label>
                    <input type="password" name="password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm new password</label>
                    <input type="password" name="confirm" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn">Update password</button>
            </form>
        </div>
    </div>
</body>
</html>
