<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Users</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#C41E3A;color:white;padding:15px 30px;display:flex;justify-content:space-between}
.header h1{font-size:22px}.header a{color:white;text-decoration:none}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px}
.btn{background:#C41E3A;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer}
.btn-secondary{background:#333}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:20px}
th{background:#f5f5f5;padding:10px;text-align:left;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
.role{padding:4px 8px;border-radius:4px;font-size:11px}
.role.admin{background:#cce5ff;color:#004085}
.role.sales{background:#d4edda;color:#155724}
.role.production{background:#fff3cd;color:#856404}
.role.customer{background:#e2e3e5;color:#383d41}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-content{background:white;padding:30px;border-radius:8px;width:400px;max-width:90%}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>ORA GLASS ERP</h1><a href="/">← Dashboard</a></div>
<div class="container"><div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="color:#333">Users</h2>
<button class="btn" onclick="openModal()">+ Add User</button>
</div>
<table>
<thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Company</th><th>Actions</th></tr></thead>
<tbody id="user-list"><tr><td colspan="5" style="text-align:center;color:#666">Loading...</td></tr></tbody>
</table>
</div></div>
<div class="modal" id="user-modal">
<div class="modal-content">
<h3 style="margin-bottom:20px">Add User</h3>
<div class="form-group"><label>Name</label><input type="text" id="u-name"></div>
<div class="form-group"><label>Email (username)</label><input type="email" id="u-email"></div>
<div class="form-group"><label>Password</label><input type="password" id="u-password"></div>
<div class="form-group"><label>Role</label><select id="u-role"><option value="admin">Admin</option><option value="sales">Sales</option><option value="production">Production</option><option value="customer">Customer</option></select></div>
<div class="form-group" id="company-group" style="display:none"><label>Company</label><select id="u-company"></select></div>
<div style="display:flex;gap:10px;margin-top:20px">
<button class="btn" onclick="saveUser()">Save</button>
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
</div>
</div>
</div>
<script>
document.getElementById('u-role').addEventListener('change',function(){document.getElementById('company-group').style.display=this.value==='customer'?'block':'none'});
async function loadUsers(){const res=await fetch('/api/users');const data=await res.json();const tbody=document.getElementById('user-list');tbody.innerHTML='';data.forEach(u=>{tbody.innerHTML+='<tr><td>'+u.name+'</td><td>'+u.id+'</td><td><span class="role '+u.role+'">'+u.role+'</span></td><td>'+(u.company||'-')+'</td><td>'+(u.id!=='admin'?'<button onclick="deleteUser(\''+u.id+'\')" style="background:none;border:none;color:#C41E3A;cursor:pointer">Delete</button>':'')+'</td></tr>'})}
async function loadCompanies(){const res=await fetch('/api/customers');const data=await res.json();const sel=document.getElementById('u-company');sel.innerHTML='<option value="">Select...</option>';data.forEach(c=>{sel.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>'})}
function openModal(){loadCompanies();document.getElementById('user-modal').classList.add('active')}
function closeModal(){document.getElementById('user-modal').classList.remove('active')}
async function saveUser(){const data={name:document.getElementById('u-name').value,email:document.getElementById('u-email').value,password:document.getElementById('u-password').value,role:document.getElementById('u-role').value,company:document.getElementById('u-company').value};await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeModal();loadUsers()}
async function deleteUser(id){if(confirm('Delete user?')){await fetch('/api/users/'+id,{method:'DELETE'});loadUsers()}}
loadUsers();
</script>
</body>
</html>
