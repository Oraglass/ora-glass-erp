<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORA Glass ERP - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #C41E3A; font-size: 32px; letter-spacing: 3px; }
        .logo span { color: #1a1a2e; font-size: 14px; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #C41E3A; }
        .btn { width: 100%; background: #C41E3A; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #a01830; }
        .error { background: #ffe6e6; color: #c41e3a; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
        .demo { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 6px; font-size: 12px; color: #666; }
        .demo strong { color: #333; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <h1>ORA</h1>
            <span>GLASS ERP</span>
        </div>
        {% if get_flashed_messages() %}
        <div class="error">{{ get_flashed_messages()[0] }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="demo">
            <strong>Demo accounts:</strong><br>
            admin / admin123 (full access)<br>
            sales / sales123 (quotes, orders, customers)<br>
            production / prod123 (orders, inventory)<br>
            customer / customer123 (view quotes, orders)
        </div>
    </div>
</body>
</html>
