<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Users</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#C41E3A;color:white;padding:15px 30px;display:flex;justify-content:space-between}
.header h1{font-size:22px}.header a{color:white;text-decoration:none}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px}
.btn{background:#C41E3A;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer}
.btn-secondary{background:#333}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:20px}
th{background:#f5f5f5;padding:10px;text-align:left;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
.role{padding:4px 8px;border-radius:4px;font-size:11px}
.role.admin{background:#cce5ff;color:#004085}
.role.customer{background:#d4edda;color:#155724}
.status{padding:4px 8px;border-radius:4px;font-size:11px}
.status.active{background:#d4edda;color:#155724}
.status.inactive{background:#f8d7da;color:#721c24}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.modal.active{display:flex}
.modal-content{background:white;padding:30px;border-radius:8px;width:400px;max-width:90%}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.permissions{display:flex;flex-direction:column;gap:8px}
.permissions label{display:flex;align-items:center;gap:8px;font-weight:normal}
</style>
</head>
<body>
<div class="header"><h1>ORA GLASS ERP</h1><a href="/">← Dashboard</a></div>
<div class="container"><div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="color:#333">Users</h2>
<button class="btn" onclick="openModal()">+ Add User</button>
</div>
<table>
<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Company</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="user-list">
<tr><td colspan="6" style="text-align:center;color:#666">No users found</td></tr>
</tbody>
</table>
</div></div>
<div class="modal" id="user-modal">
<div class="modal-content">
<h3 style="margin-bottom:20px">Add User</h3>
<div class="form-group"><label>Name</label><input type="text" id="user-name"></div>
<div class="form-group"><label>Email</label><input type="email" id="user-email"></div>
<div class="form-group"><label>Role</label><select id="user-role"><option value="customer">Customer</option><option value="admin">Admin</option></select></div>
<div class="form-group"><label>Company</label><select id="user-company"><option value="">Select company...</option></select></div>
<div class="form-group"><label>Permissions</label>
<div class="permissions">
<label><input type="checkbox" id="perm-quotes" checked> Quotations</label>
<label><input type="checkbox" id="perm-orders"> Orders in Progress</label>
<label><input type="checkbox" id="perm-invoices"> Invoices</label>
<label><input type="checkbox" id="perm-financial"> Financial Situation</label>
</div>
</div>
<div style="display:flex;gap:10px;margin-top:20px">
<button class="btn" onclick="saveUser()">Save</button>
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
</div>
</div>
</div>
<script>
function openModal(){document.getElementById('user-modal').classList.add('active')}
function closeModal(){document.getElementById('user-modal').classList.remove('active')}
function saveUser(){/* TODO: implement save */}
</script>
</body>
</html>
