<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ORA Glass ERP - Quote History</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#C41E3A;color:white;padding:15px 30px;display:flex;justify-content:space-between}
.header h1{font-size:22px}.header a{color:white;text-decoration:none}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:20px}
.filters{display:flex;gap:15px;margin-bottom:20px;flex-wrap:wrap}
.filters select,.filters input{padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.btn{background:#C41E3A;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f5f5f5;padding:10px;text-align:left;border-bottom:2px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="header"><h1>ORA GLASS ERP</h1><a href="/">← Dashboard</a></div>
<div class="container"><div class="card">
<h2 style="margin-bottom:20px;color:#333">Quote History</h2>
<div class="filters">
<select id="filter-user"><option value="">All Users</option></select>
<input type="text" id="filter-project" placeholder="Project name">
<input type="date" id="filter-from">
<input type="date" id="filter-to">
<button class="btn" onclick="filterQuotes()">Filter</button>
</div>
<table>
<thead><tr><th>Date</th><th>User</th><th>Project</th><th>Product</th><th>Currency</th><th>Total</th><th>Type</th></tr></thead>
<tbody id="quote-list"><tr><td colspan="7" style="text-align:center;color:#666">No quotes found</td></tr></tbody>
</table>
</div></div>
<script>
function filterQuotes(){/* TODO: implement filtering */}
</script>
</body>
</html>
